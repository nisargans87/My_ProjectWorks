<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Chatbot</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 900px;
      height: 600px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .chat-header {
      background: #4f46e5;
      color: white;
      padding: 18px 25px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bot-icon {
      width: 45px;
      height: 45px;
      background: white;
      color: #4f46e5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .chat-header h2 {
      font-size: 20px;
    }

    .chat-header p {
      font-size: 13px;
      opacity: 0.8;
      margin-top: 3px;
    }

    /* Chat messages */
    .chat-box {
      flex: 1;
      padding: 25px;
      overflow-y: auto;
      background: #f9fafb;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 15px;
      font-size: 15px;
      line-height: 1.5;
    }

    .bot-message {
      background: white;
      align-self: flex-start;
      border-bottom-left-radius: 3px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }

    .user-message {
      background: #4f46e5;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 3px;
    }

    /* Input area */
    .chat-input {
      display: flex;
      padding: 15px;
      background: white;
      border-top: 1px solid #ddd;
      gap: 10px;
    }

    .chat-input input {
      flex: 1;
      padding: 14px 18px;
      border: 1px solid #ddd;
      border-radius: 25px;
      outline: none;
      font-size: 15px;
    }

    .chat-input input:focus {
      border-color: #4f46e5;
    }

    .chat-input button {
      border: none;
      background: #4f46e5;
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
    }

    .chat-input button:hover {
      background: #3730a3;
    }

    @media (max-width: 700px) {
      .chat-container {
        width: 100%;
        height: 100vh;
        border-radius: 0;
      }
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <!-- Header -->
    <div class="chat-header">
      <div class="bot-icon">🤖</div>

      <div>
        <h2>AI Assistant</h2>
        <p>● Online</p>
      </div>
    </div>

    <!-- Messages -->
    <div class="chat-box" id="chatBox">

      <div class="message bot-message">
        👋 Hello! I am your AI programming mentor.
        <br><br>
        How can I help you today?
      </div>

    </div>

    <!-- Input -->
    <div class="chat-input">

      <input
        type="text"
        id="userInput"
        placeholder="Ask me anything..."
      >

      <button onclick="sendMessage()">➤</button>

    </div>

  </div>


  <script>

    function sendMessage() {

      const input = document.getElementById("userInput");
      const message = input.value.trim();

      if (message === "") return;

      const chatBox = document.getElementById("chatBox");

      // User message
      const userMessage = document.createElement("div");

      userMessage.classList.add(
        "message",
        "user-message"
      );

      userMessage.innerText = message;

      chatBox.appendChild(userMessage);

      // Clear input
      input.value = "";

      // Scroll down
      chatBox.scrollTop = chatBox.scrollHeight;

      // Temporary bot reply
      setTimeout(() => {

        const botMessage = document.createElement("div");

        botMessage.classList.add(
          "message",
          "bot-message"
        );

        botMessage.innerText =
          "Thanks for your question! 🤖 This response will come from your AI backend.";

        chatBox.appendChild(botMessage);

        chatBox.scrollTop = chatBox.scrollHeight;

      }, 700);

    }


    // Press Enter to send
    document
      .getElementById("userInput")
      .addEventListener("keypress", function(event) {

        if (event.key === "Enter") {
          sendMessage();
        }

      });

  </script>

</body>
</html>
