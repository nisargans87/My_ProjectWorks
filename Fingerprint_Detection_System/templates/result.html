<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fingerprint Verification Result</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="background"></div>

<div class="glass result-glass">

    <div class="logo">

        <div class="scanner">

            <i class="fa-solid fa-fingerprint"></i>

            <span class="scan-ring"></span>

        </div>

        <h1>Fingerprint Verification Result</h1>

        <p class="subtitle">
            Fingerprint Recognition System
        </p>

    </div>


    <div class="profile-section">

        <img
            src="/{{ image_path }}"
            class="fingerprint-image"
            alt="Fingerprint">

        <div class="profile-info">

            <h2>{{ name }}</h2>

        </div>

    </div>


    <div class="result-grid">

        <div class="info-card">

            <div class="info-title">

                <i class="fa-solid fa-hand"></i>

                Finger Classification

            </div>

            <div class="prediction-value">

                {{ predicted_group }}

            </div>

        </div>


        <div class="info-card">

            <div class="info-title">

                <i class="fa-solid fa-chart-line"></i>

                Prediction Accuracy

            </div>

            <div class="confidence-value">

                {{ confidence }} %

            </div>

            <div class="progress">

                <div class="progress-bar"
                     style="width: {{ confidence }}%;">

                </div>

            </div>

        </div>

    </div>


    <div class="scan-details">

        <div>

            <span>Date & Time</span>

            <strong id="currentDateTime"></strong>

        </div>

    </div>


    <div class="buttons">

        <a href="/">

            <button class="primary-btn">

                <i class="fa-solid fa-fingerprint"></i>

                Scan Another Fingerprint

            </button>

        </a>

        <a href="/history">

            <button class="secondary-btn">

                <i class="fa-solid fa-clock-rotate-left"></i>

                Detection History

            </button>

        </a>

    </div>

</div>


<script>

const now = new Date();

document.getElementById("currentDateTime").innerHTML =
    now.toLocaleString();

</script>

</body>

</html>
